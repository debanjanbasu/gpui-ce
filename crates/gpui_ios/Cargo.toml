[package]
name = "gpui_ce_ios"
version = "0.4.0"
edition.workspace = true
publish = true
license = "Apache-2.0"
description = "Native iOS platform support for GPUI CE"

[lib]
name = "gpui_ios"
path = "src/gpui_ios.rs"

[lints]
workspace = true

[dependencies]
accesskit_ios.workspace = true
anyhow.workspace = true
block2.workspace = true
futures.workspace = true
gpui-ce = { path = "../gpui" }
gpui_parley = { path = "../gpui_ce_parley", package = "gpui_ce_parley" }
gpui_render = { path = "../gpui_render", package = "gpui_ce_render", features = ["swash"] }
gpui_ce_apple = { path = "../gpui_apple" }
log.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-foundation = { workspace = true, features = ["NSTimer"] }
objc2-quartz-core.workspace = true
objc2-ui-kit = { workspace = true, features = [
  "UIApplication", "UIScreen", "UITouch", "UIView", "UIResponder", "UIWindow",
  "UIWindowScene", "UIViewController", "UITraitCollection", "UIPasteboard",
  "UIEvent", "UIScene", "UISceneConfiguration", "UISceneSession", "UISceneDefinitions",
  "UISceneOptions", "UIGeometry", "block2", "objc2-quartz-core",
  "UIOpenURLContext", "UITextInput", "UITextInputTraits", "UITextInteraction",
  "UIConversationContext", "UIInteraction", "UIInterface", "objc2-core-foundation",
] }
parking_lot.workspace = true
raw-window-handle.workspace = true
slotmap.workspace = true
uuid.workspace = true
