[package]
name = "gpui_ce_android"
version = "0.4.0"
edition.workspace = true
publish = true
license = "Apache-2.0"
description = "Native Android platform support for GPUI CE"

[lib]
name = "gpui_android"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui-ce = { path = "../gpui" }
gpui_parley = { path = "../gpui_ce_parley", package = "gpui_ce_parley" }
gpui_render = { path = "../gpui_render", package = "gpui_ce_render", features = ["swash"] }
gpui_ce_wgpu = { path = "../gpui_wgpu", package = "gpui_ce_wgpu" }
log.workspace = true
parking_lot.workspace = true
raw-window-handle.workspace = true
slotmap.workspace = true
uuid.workspace = true
gpui_util.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
ndk = "0.8"
pollster = "0.4"
